server:
  port: 8086
  servlet:
    context-path: /

spring:
  application:
    name: trace-agent
  redis:
    host: localhost
    port: 6379
    database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: AGRI_TRACE

trace:
  jwt:
    secret: agri-trace-agent-secret-2026
  auth:
    exclude-paths: /error,/actuator/**,/api/agent/**
  python:
    base-url: http://localhost:8000

logging:
  level:
    com.trace.agent: debug
