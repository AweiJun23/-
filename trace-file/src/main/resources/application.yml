server:
  port: 8088
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: 10MB

spring:
  application:
    name: trace-file
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: AGRI_TRACE

trace:
  jwt:
    secret: agri-trace-file-secret-2026
  auth:
    exclude-paths: /error,/actuator/**,/api/file/**

logging:
  level:
    com.trace.file: debug
