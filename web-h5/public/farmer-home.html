<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>农户工作台 · 城乡农品溯源</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #0b3d2e 0%, #07c160 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #303133;
  }
  .phone {
    width: 420px; max-width: 96vw; height: min(860px, calc(100vh - 24px));
    background: #f4f7f5; border-radius: 20px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.28);
    display: flex; flex-direction: column;
  }
  /* 顶部 */
  .hero {
    background: linear-gradient(135deg, #07c160, #0aa858);
    color: #fff; padding: 16px 18px; flex: none;
    display: flex; align-items: center; justify-content: space-between;
  }
  .hero .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hero .avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
  .hero h1 { margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero p { margin: 2px 0 0; font-size: 11px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero .out { background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 8px;
    padding: 6px 12px; font-size: 12px; cursor: pointer; flex: none; }
  /* 内容区：三个页面，各自内部滚动 */
  .pages { flex: 1; min-height: 0; position: relative; }
  .page { position: absolute; inset: 0; overflow-y: auto; padding: 14px 14px 18px; display: none; }
  .page.on { display: block; }
  .card { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); margin-bottom: 12px; }
  .card h2 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .card h2 .bar { width: 4px; height: 14px; background: #07c160; border-radius: 2px; }
  .card h2 .cnt { color: #909399; font-size: 12px; font-weight: 400; }
  .empty { text-align: center; color: #909399; font-size: 13px; padding: 22px 0; }
  /* 批次卡 */
  .batch-item { border: 1px solid #e4e7ed; border-radius: 10px; padding: 11px 12px; cursor: pointer;
    transition: all .15s; margin-bottom: 10px; background: #fff; }
  .batch-item.active { border-color: #07c160; background: #f0fbf5; box-shadow: 0 0 0 2px rgba(7,193,96,.12); }
  .batch-item .t { font-weight: 600; font-size: 14px; }
  .batch-item .t .no { color: #07c160; font-family: Consolas, monospace; }
  .batch-item .meta { font-size: 12px; color: #909399; margin-top: 4px; }
  /* 表单 */
  .field { margin-bottom: 11px; }
  .field label { display: block; font-size: 12px; color: #606266; margin-bottom: 5px; }
  .field label em { color: #f56c6c; font-style: normal; margin-right: 2px; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid #dcdfe6; border-radius: 9px; padding: 9px 11px; font-size: 14px;
    outline: none; transition: border-color .15s; background: #fff; font-family: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #07c160; }
  .row2 { display: flex; gap: 10px; }
  .row2 .field { flex: 1; }
  .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .type-btn { border: 1px solid #dcdfe6; border-radius: 10px; background: #fff; padding: 10px 0 8px;
    text-align: center; cursor: pointer; font-size: 12px; color: #606266; transition: all .15s; }
  .type-btn .ico { font-size: 20px; display: block; margin-bottom: 3px; }
  .type-btn.on { border-color: #07c160; background: #f0fbf5; color: #07c160; font-weight: 600; }
  .btn { width: 100%; height: 44px; border: none; border-radius: 10px; cursor: pointer;
    background: #07c160; color: #fff; font-size: 15px; font-weight: 600; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .msg { margin-top: 10px; font-size: 13px; border-radius: 8px; padding: 9px 11px; display: none; line-height: 1.5; }
  .msg.err { display: block; background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
  .msg.ok  { display: block; background: #f0f9eb; color: #229954; border: 1px solid #d6ecbe; }
  .hint { font-size: 12px; color: #909399; margin: 9px 0 0; line-height: 1.6; }
  /* 记录列表 */
  .rec { border-bottom: 1px dashed #ebeef5; padding: 9px 2px; font-size: 13px; }
  .rec:last-child { border-bottom: none; }
  .rec .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rec .type { font-weight: 600; min-width: 0; }
  .rec .type .tag { display: inline-block; font-size: 11px; font-weight: 500; border-radius: 4px;
    padding: 1px 6px; margin-right: 6px; background: #ecf5ff; color: #409eff; }
  .rec .status { font-size: 11px; border-radius: 4px; padding: 2px 8px; flex: none; }
  .rec .status.WAIT { background: #fdf6ec; color: #e6a23c; }
  .rec .status.PASS { background: #f0f9eb; color: #67c23a; }
  .rec .status.REJECT { background: #fef0f0; color: #f56c6c; }
  .rec .sub { color: #909399; margin-top: 4px; }
  .rec .ai { margin-top: 4px; color: #8d6cab; font-size: 12px; background: #f7f2fb; border-radius: 6px; padding: 6px 8px; }
  /* 底部导航 */
  .tabbar { flex: none; display: flex; background: #fff; border-top: 1px solid #ebeef5; }
  .tab { flex: 1; text-align: center; padding: 8px 0 10px; cursor: pointer; color: #909399; font-size: 11px;
    user-select: none; }
  .tab .ico { font-size: 20px; display: block; margin-bottom: 2px; }
  .tab.on { color: #07c160; font-weight: 600; }
  .lock { text-align: center; padding: 40px 0; }
  .lock .btn { width: auto; padding: 0 26px; margin-top: 14px; display: inline-block; height: 42px; line-height: 42px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="hero">
      <div class="who">
        <div class="avatar">🧑‍🌾</div>
        <div>
          <h1 id="w-name">农户工作台</h1>
          <p id="w-sub">城乡农品轻量溯源与碳足迹存证系统</p>
        </div>
      </div>
      <button class="out" onclick="logout()">退出</button>
    </div>

    <!-- 未登录 -->
    <div id="lock" class="page lock" style="display:block">
      <div style="font-size:34px">🔐</div>
      <div class="empty">尚未登录，请先登录农户账号</div>
      <a class="btn" href="/farmer-login.html">去登录</a>
    </div>

    <div id="main" class="pages" style="display:none">
      <!-- 页1：我的批次 -->
      <div class="page on" id="page-batch">
        <div class="card">
          <h2><span class="bar"></span>我的批次 <span class="cnt" id="b-count"></span></h2>
          <div id="batches"><div class="empty">加载中…</div></div>
          <p class="hint" style="margin:0">点选批次后，"农事录入"和"农事记录"都会针对该批次操作。</p>
        </div>
      </div>

      <!-- 页2：农事录入 -->
      <div class="page" id="page-input">
        <div class="card">
          <h2><span class="bar"></span>当前批次：<span id="cur-batch" style="color:#07c160">未选择</span></h2>
          <div class="types" id="types"></div>
          <div class="field">
            <label id="f-material-label"><em>*</em>肥料名称</label>
            <input id="f-material" placeholder="如 有机肥 / 尿素" />
          </div>
          <div class="row2">
            <div class="field">
              <label><em>*</em>用量</label>
              <input id="f-amount" type="number" step="0.01" min="0.01" placeholder="0.00" />
            </div>
            <div class="field">
              <label>单位</label>
              <input id="f-unit" value="kg" />
            </div>
          </div>
          <div class="row2">
            <div class="field">
              <label><em>*</em>作业日期</label>
              <input id="f-date" type="date" />
            </div>
            <div class="field">
              <label>作业面积（亩）</label>
              <input id="f-area" type="number" step="0.01" min="0" placeholder="选填" />
            </div>
          </div>
          <div class="field">
            <label>备注</label>
            <input id="f-remark" placeholder="选填" />
          </div>
          <button id="f-btn" class="btn" onclick="submitRecord()">提交农事记录</button>
          <div id="f-msg" class="msg"></div>
          <p class="hint">提交后自动进入 AI 智能校验，并经消息队列驱动碳足迹核算与链上存证。</p>
        </div>
      </div>

      <!-- 页3：农事记录 -->
      <div class="page" id="page-rec">
        <div class="card">
          <h2><span class="bar"></span>农事记录 <span class="cnt" id="r-batch"></span><span class="cnt" id="r-count"></span></h2>
          <div id="records"><div class="empty">请先在"我的批次"里选择批次</div></div>
        </div>
      </div>
    </div>

    <!-- 底部导航 -->
    <div class="tabbar" id="tabbar" style="display:none">
      <div class="tab on" data-p="batch" onclick="go('batch')"><span class="ico">📦</span>我的批次</div>
      <div class="tab" data-p="input" onclick="go('input')"><span class="ico">✏️</span>农事录入</div>
      <div class="tab" data-p="rec" onclick="go('rec')"><span class="ico">📋</span>农事记录</div>
    </div>
  </div>

<script>
  var API = "";
  var TYPES = [
    { k:'FERTILIZE', ico:'🧪', name:'施肥',    label:'肥料名称',  ph:'如 有机肥 / 尿素',    unit:'kg' },
    { k:'IRRIGATE',  ico:'💧', name:'灌溉',    label:'水源 / 方式', ph:'如 地表水滴灌',      unit:'m3' },
    { k:'MACHINE',   ico:'🚜', name:'农机作业', label:'农机 / 燃油', ph:'如 拖拉机（柴油）',  unit:'L' },
    { k:'PESTICIDE', ico:'🧴', name:'农药施用', label:'农药名称',   ph:'如 低毒杀虫剂',       unit:'kg' },
    { k:'FILM',      ico:'🎞️', name:'农膜使用', label:'农膜类型',   ph:'如 聚乙烯地膜',       unit:'kg' },
    { k:'HARVEST',   ico:'🌾', name:'收获',    label:'收获物',     ph:'如 水稻',             unit:'kg' }
  ];
  var STATUS_DESC = { WAIT:'待AI校验', PASS:'校验通过', REJECT:'驳回', MANUAL:'人工复核' };
  var user = null, token = null, batches = [], currentBatch = null, curType = TYPES[0];

  function $(id){ return document.getElementById(id); }
  function fmt(d){ return (d || '').toString().slice(0, 10); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function authHeaders(){ return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }; }

  function logout(){
    localStorage.removeItem('farmer_token');
    localStorage.removeItem('farmer_user');
    location.href = '/farmer-login.html';
  }

  /* 底部标签页切换 */
  function go(p){
    document.querySelectorAll('.page').forEach(function(el){ el.classList.remove('on'); });
    $('page-' + p).classList.add('on');
    document.querySelectorAll('.tab').forEach(function(el){
      el.className = 'tab' + (el.getAttribute('data-p') === p ? ' on' : '');
    });
    if(p === 'rec' && currentBatch) loadRecords();
  }

  function renderTypes(){
    $('types').innerHTML = TYPES.map(function(t, i){
      return '<div class="type-btn' + (i === 0 ? ' on' : '') + '" data-i="' + i + '" onclick="pickType(' + i + ')">'
        + '<span class="ico">' + t.ico + '</span>' + t.name + '</div>';
    }).join('');
  }
  function pickType(i){
    curType = TYPES[i];
    document.querySelectorAll('.type-btn').forEach(function(el, k){
      el.className = 'type-btn' + (k === i ? ' on' : '');
    });
    $('f-material-label').innerHTML = '<em>*</em>' + curType.label;
    $('f-material').placeholder = curType.ph;
    $('f-unit').value = curType.unit;
  }

  async function init(){
    token = localStorage.getItem('farmer_token');
    try { user = JSON.parse(localStorage.getItem('farmer_user') || 'null'); } catch(e){ user = null; }
    if(!token || !user || user.role !== 'FARMER'){ $('lock').style.display = 'block'; return; }
    $('lock').style.display = 'none';
    $('main').style.display = 'block';
    $('tabbar').style.display = 'flex';
    $('w-name').textContent = (user.realName || user.username) + ' 的工作台';
    $('w-sub').textContent = '账号 ' + user.username + ' · 农户 · 合作社 ' + (user.coopId || '-');
    $('f-date').value = new Date().toISOString().slice(0, 10);
    renderTypes(); pickType(0);
    loadBatches();
  }

  async function loadBatches(){
    var box = $('batches');
    try{
      var res = await fetch(API + '/api/batch/list', { headers: authHeaders() });
      var j = await res.json();
      if(j && j.code === 200 && Array.isArray(j.data)){
        batches = j.data.filter(function(b){ return String(b.farmerId) === String(user.userId); });
        $('b-count').textContent = '（' + batches.length + ' 个）';
        if(!batches.length){
          box.innerHTML = '<div class="empty">您名下暂无批次，请联系管理员在后台创建</div>';
          return;
        }
        box.innerHTML = batches.map(function(b, i){
          return '<div class="batch-item" data-i="' + i + '" onclick="pickBatch(' + i + ')">'
            + '<div class="t"><span class="no">' + esc(b.batchNo) + '</span> · ' + esc(b.productName || '-') + '</div>'
            + '<div class="meta">批次ID ' + b.id + ' · ' + (b.areaMu || '-') + ' 亩 · 状态 ' + esc(b.status || '-')
            + ' · 定植 ' + fmt(b.plantStartDate) + '</div></div>';
        }).join('');
        pickBatch(0);
      } else {
        box.innerHTML = '<div class="empty">加载失败：' + esc((j && (j.msg || j.message)) || res.status) + '</div>';
      }
    }catch(e){
      box.innerHTML = '<div class="empty">无法连接后端，请确认网关 9000 已启动</div>';
    }
  }

  async function pickBatch(i){
    currentBatch = batches[i];
    document.querySelectorAll('.batch-item').forEach(function(el, k){
      el.className = 'batch-item' + (k === i ? ' active' : '');
    });
    $('cur-batch').textContent = currentBatch.batchNo + '（' + (currentBatch.productName || '-') + '）';
    $('r-batch').textContent = currentBatch.batchNo;
    loadRecords();
  }

  async function loadRecords(){
    if(!currentBatch) return;
    var box = $('records');
    box.innerHTML = '<div class="empty">加载中…</div>';
    try{
      var res = await fetch(API + '/api/farming/list/' + currentBatch.id, { headers: authHeaders() });
      var j = await res.json();
      if(j && j.code === 200 && Array.isArray(j.data)){
        var list = j.data;
        $('r-count').textContent = '（' + list.length + ' 条）';
        if(!list.length){
          box.innerHTML = '<div class="empty">该批次暂无农事记录，去"农事录入"记一条吧</div>';
          return;
        }
        box.innerHTML = list.map(function(r){
          var desc = r.farmingTypeDesc || r.farmingType;
          var ai = r.aiAdvice ? '<div class="ai">🤖 AI 建议：' + esc(r.aiAdvice) + '</div>' : '';
          return '<div class="rec">'
            + '<div class="head"><span class="type"><span class="tag">' + esc(desc) + '</span>'
            + esc(r.materialName || '') + ' ' + r.amount + esc(r.unit || '') + '</span>'
            + '<span class="status ' + esc(r.checkStatus || 'WAIT') + '">' + (STATUS_DESC[r.checkStatus] || esc(r.checkStatus)) + '</span></div>'
            + '<div class="sub">作业日期 ' + fmt(r.workDate) + (r.areaMu ? ' · ' + r.areaMu + ' 亩' : '')
            + (r.remark ? ' · ' + esc(r.remark) : '') + '</div>' + ai + '</div>';
        }).join('');
      } else {
        box.innerHTML = '<div class="empty">加载失败：' + esc((j && (j.msg || j.message)) || res.status) + '</div>';
      }
    }catch(e){
      box.innerHTML = '<div class="empty">无法连接后端</div>';
    }
  }

  async function submitRecord(){
    if(!currentBatch){ showMsg('err', '请先到"我的批次"选择一个批次'); return; }
    var material = $('f-material').value.trim();
    var amount = parseFloat($('f-amount').value);
    var unit = $('f-unit').value.trim();
    var date = $('f-date').value;
    var areaRaw = $('f-area').value;
    var remark = $('f-remark').value.trim();
    if(!date){ showMsg('err', '请选择作业日期'); return; }
    if(!material){ showMsg('err', '请填写' + curType.label); return; }
    if(!(amount > 0)){ showMsg('err', '用量必须大于 0'); return; }

    var btn = $('f-btn');
    btn.disabled = true; btn.textContent = '提交中…';
    try{
      var res = await fetch(API + '/api/farming/record', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({
          batchId: currentBatch.id,
          batchNo: currentBatch.batchNo,
          farmingType: curType.k,
          materialName: material,
          amount: amount,
          unit: unit,
          workDate: date,
          areaMu: areaRaw ? parseFloat(areaRaw) : null,
          remark: remark || null
        })
      });
      var j = await res.json();
      if(j && j.code === 200){
        showMsg('ok', '✅ 记录已提交（记录ID ' + j.data + '），已进入 AI 校验与碳核算流程');
        $('f-amount').value = ''; $('f-material').value = ''; $('f-remark').value = '';
      } else {
        showMsg('err', '提交失败：' + esc((j && (j.msg || j.message)) || res.status));
      }
    }catch(e){
      showMsg('err', '无法连接后端（' + esc(e && e.message ? e.message : e) + '）');
    }finally{
      btn.disabled = false; btn.textContent = '提交农事记录';
    }
  }

  function showMsg(type, text){ var el = $('f-msg'); el.className = 'msg ' + type; el.innerHTML = text; }

  init();
</script>
</body>
</html>
