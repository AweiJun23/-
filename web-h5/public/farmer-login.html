<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>农户登录 · 城乡农品溯源</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #0b3d2e 0%, #07c160 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #303133;
  }
  .phone {
    width: 380px; max-width: 94vw; background: #fff; border-radius: 20px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.28);
  }
  .hero {
    background: linear-gradient(135deg, #07c160, #0aa858);
    color: #fff; padding: 34px 24px 28px; text-align: center;
  }
  .hero .logo { font-size: 40px; line-height: 1; }
  .hero h1 { margin: 12px 0 4px; font-size: 20px; }
  .hero p { margin: 0; font-size: 12px; opacity: .9; }
  .body { padding: 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #606266; margin-bottom: 6px; }
  .field input {
    width: 100%; height: 46px; border: 1px solid #dcdfe6; border-radius: 10px;
    padding: 0 14px; font-size: 15px; outline: none; transition: border-color .15s;
  }
  .field input:focus { border-color: #07c160; }
  .btn {
    width: 100%; height: 48px; border: none; border-radius: 10px; cursor: pointer;
    background: #07c160; color: #fff; font-size: 16px; font-weight: 600;
  }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .tip { text-align: center; color: #909399; font-size: 12px; margin-top: 14px; }
  .msg { margin-top: 14px; font-size: 13px; border-radius: 8px; padding: 10px 12px; display: none; }
  .msg.err { display: block; background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
  .foot { text-align: center; color: #c0c4cc; font-size: 11px; padding: 0 0 18px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="hero">
      <div class="logo">🌾</div>
      <h1>农户登录</h1>
      <p>城乡农品轻量溯源与碳足迹存证系统</p>
    </div>
    <div class="body">
      <div class="field">
        <label>账号</label>
        <input id="u" value="farmer01" placeholder="请输入账号" autocomplete="username" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="p" type="password" value="123456" placeholder="请输入密码" autocomplete="current-password" />
      </div>
      <button id="btn" class="btn" onclick="doLogin()">登 录</button>
      <div id="msg" class="msg"></div>
      <p class="tip">演示账号 farmer01 ~ farmer09　密码：123456</p>
      <p class="tip">还没有账号？<a href="/farmer-register.html" style="color:#07c160;font-weight:600;text-decoration:none">立即注册</a></p>
    </div>
    <div class="foot">数据经联盟链存证 · 扫码可验真</div>
  </div>

<script>
  // 留空 = 走当前站点同源 /api（由 H5 dev-server 代理到网关 9000，避免 file:// 跨域被拦）
  var API = "";
  function show(el, type, text){ el.className = "msg " + type; el.innerHTML = text; }
  async function doLogin(){
    var u = document.getElementById('u').value.trim();
    var p = document.getElementById('p').value;
    var msg = document.getElementById('msg');
    var btn = document.getElementById('btn');
    if(!u){ show(msg,'err','请输入账号'); return; }
    if(!p){ show(msg,'err','请输入密码'); return; }
    btn.disabled = true; btn.textContent = '登录中…';
    try{
      var res = await fetch(API + '/api/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username:u, password:p, channel:'APP'})
      });
      var j = await res.json();
      if(j && j.code === 200 && j.data){
        // 持久化登录态，供工作台页读取
        localStorage.setItem('farmer_token', j.data.token || '');
        localStorage.setItem('farmer_user', JSON.stringify({
          userId: j.data.userId, username: j.data.username, realName: j.data.realName,
          role: j.data.role, coopId: j.data.coopId, channel: j.data.channel
        }));
        btn.textContent = '登录成功，正在进入…';
        // 登录成功直接进入农户工作台
        location.href = '/farmer-home.html';
        return;
      } else {
        show(msg,'err','登录失败：' + ((j && j.msg) || '账号或密码错误'));
      }
    }catch(e){
      show(msg,'err','无法连接后端（' + API + '）。请确认微服务/网关已启动。<br>错误：' + (e && e.message ? e.message : e));
    }
    btn.disabled = false; btn.textContent = '登 录';
  }
</script>
</body>
</html>
