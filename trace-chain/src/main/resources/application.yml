server:
  port: 8085
  servlet:
    context-path: /

spring:
  application:
    name: trace-chain
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/agri_trace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
    database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: AGRI_TRACE

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

trace:
  jwt:
    secret: agri-trace-chain-secret-2026
  auth:
    exclude-paths: /error,/actuator/**,/api/chain/internal/**

logging:
  level:
    com.trace.chain: debug
