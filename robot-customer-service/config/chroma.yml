collection_name: agent

persist_directory: chroma_db
#  向量检索，匹配的k个结果
k: 3
#数据文件夹
data_path: data
#里面记录哪些md5已经被处理过了
md5_hex_store: md5.text
#允许哪些后缀的文件被加载到知识库里面
allow_knowledge_file_type: ["txt","pdf"]
# 每次切分文本的目标块大小，单位：token/字符，这里设置每一块大约200个字符
chunk_size: 200

# 文本块之间重叠的字符数量：20
# 上一个块末尾20个字符，会复制到下一个块开头；解决语义被切割断、上下文丢失问题
chunk_overlap: 20

# 切分文本的分隔符列表，优先级从左到右，优先使用左边的分隔符切
# 先按两个换行（段落）切，再单个换行，再中英文标点，最后空格，实在不行空字符串强制切割
separators: ["\n\n","\n",".",",","!","?","。","，","！","？"," ",""]